# Hooks run by the pre-commit framework (https://pre-commit.com) before each
# commit. Set up once per clone:
#   uv tool install pre-commit && pre-commit install
# gitleaks picks up .gitleaks.toml and .gitleaksignore from the repository root.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
