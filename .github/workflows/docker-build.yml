name: Docker Build

# Builds, tests, publishes and attests one image. Every tag rule lives here,
# so which channel may publish which tag is decided in one place.
on:
  workflow_call:
    inputs:
      channel:
        description: "snapshot, edge or release"
        required: true
        type: string
      ref:
        description: "Git ref to build; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      version:
        description: "Release version X.Y.Z (release channel only)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # Tests use only Node built-ins, so no install step is needed.
      - name: Test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Validate inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$CHANNEL" in
            snapshot|edge|release) ;;
            *) echo "Unknown channel: $CHANNEL" >&2; exit 1 ;;
          esac
          if [ "$CHANNEL" = release ]; then
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "The release channel needs version X.Y.Z, got '$VERSION'" >&2
              exit 1
            fi
            # The image is tagged VERSION, so it must be built from that tag.
            if [ "$REF" != "v$VERSION" ]; then
              echo "Release $VERSION must be built from tag v$VERSION, got '$REF'" >&2
              exit 1
            fi
          fi
          if [ "$CHANNEL" = snapshot ]; then
            # The image is tagged snapshot-<branch>; tags and other refs have
            # no branch to name it after.
            if [ "$REF_TYPE" != branch ]; then
              echo "Snapshots are built from branches, got $REF_TYPE '$REF_NAME'" >&2
              exit 1
            fi
            # Docker tags stop at 128 characters, "snapshot-" included.
            if [ "${#REF_NAME}" -gt 119 ]; then
              echo "Branch name is ${#REF_NAME} characters; snapshots need 119 or fewer" >&2
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The commit is read from the checkout, not github.sha: when release.yml
      # calls this workflow, github.sha is the commit before the release.
      - name: Compute version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            release)  v="$VERSION" ;;
            snapshot) v="$(node scripts/dev-version.mjs snapshot)" ;;
            *)        v="$(node scripts/dev-version.mjs dev)" ;;
          esac
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to publish version '$v'" >&2
            exit 1
          fi
          base="${v%%-*}"
          {
            echo "version=$v"
            echo "minor=${base%.*}"
            echo "major=${base%%.*}"
            echo "revision=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      # A current QEMU for the non-native platforms. BuildKit's built-in
      # emulator crashes the Claude CLI's arm64 binary with SIGILL.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=false: metadata-action's default can add latest by itself.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.short }},enable=${{ inputs.channel != 'snapshot' }}
            type=ref,event=branch,prefix=snapshot-,enable=${{ inputs.channel == 'snapshot' }}
            type=raw,value=edge,enable=${{ inputs.channel == 'edge' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ inputs.channel != 'snapshot' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ steps.version.outputs.revision }}
          cache-from: type=gha,scope=${{ inputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ inputs.channel }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
