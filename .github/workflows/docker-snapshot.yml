name: Docker Snapshot

# Build a testable image from any branch:
#   gh workflow run docker-snapshot.yml --ref <branch>
# Tags: snapshot-<branch>, sha-<short>. amd64 only - the target is the NAS.
on:
  workflow_dispatch:

permissions: {}

# One build per branch at a time, in order, so snapshot-<branch> always ends
# on the newest commit and no push is interrupted before it is attested.
concurrency:
  group: docker-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-build.yml
    with:
      channel: snapshot
      platforms: linux/amd64
