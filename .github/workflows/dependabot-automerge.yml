name: Dependabot auto-merge

# Merges the open Dependabot pull requests that scripts/dependabot-eligibility.mjs
# finds safe: only patch and minor updates to the release tooling or the
# workflow actions, with every check passed. The Claude CLI, the Dockerfile and
# major updates are left to a person. It runs when a check workflow finishes on
# a Dependabot pull request, so the last check to finish finds the others
# passed and the merge follows; a run for any other author is skipped. It runs
# from the default branch, so it never executes code from a pull request.
# workflow_dispatch sweeps on demand.
on:
  workflow_run:
    workflows: ["PR Checks", "Links", "CLI flags", "CodeQL"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A pull request that is not eligible yet, or at all, is a normal outcome.
      - name: Merge the eligible pull requests
        run: |
          for pr in $(gh pr list --author "app/dependabot" --state open --json number --jq '.[].number'); do
            echo "== #$pr"
            if gh pr view "$pr" --json author,files,commits,statusCheckRollup | node scripts/dependabot-eligibility.mjs; then
              gh pr merge "$pr" --squash --delete-branch
            fi
          done
