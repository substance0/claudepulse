name: Release

on:
  push:
    branches:
      - main # Only trigger on main branch (develop pushes won't trigger this)

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # ============================================================================
      # Sync Release Changes to Develop Branch
      # ============================================================================
      # After semantic-release creates version bump commits and updates CHANGELOG.md
      # on main, we merge those changes back into develop to keep branches synchronized.
      #
      # Strategy (Team-Friendly):
      # - Merge main into develop (preserves history, no force-push needed)
      # - Uses -X theirs for conflicts in version files (package.json, CHANGELOG.md)
      # - Safe for teams: doesn't rewrite history or break feature branches
      # - Workflow fails if conflicts can't be auto-resolved
      #
      # Why merge instead of rebase?
      # - No force-push required → doesn't break developers' feature branches
      # - Preserves commit history → easier to track changes
      # - GitHub-friendly → works well with PR workflows
      # ============================================================================
      - name: Sync release to develop branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git with GitHub Actions bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Configure git to use GITHUB_TOKEN for authentication
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          # Fetch all branches to ensure we have latest state
          git fetch origin main develop

          # Check if develop branch exists
          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "⚠️  Develop branch does not exist, skipping sync"
            exit 0
          fi

          # Checkout develop branch
          git checkout develop
          git pull origin develop

          # Merge main into develop
          echo "🔄 Merging main into develop..."

          # Use -X theirs strategy to prefer main's changes for version conflicts
          # This ensures version bumps from main take precedence
          # Note: No [skip ci] needed - this workflow only triggers on main branch
          git merge origin/main -X theirs --no-edit -m "chore: sync release changes from main"

          # Push the merged develop branch (regular push, no force needed)
          git push origin develop

          echo "✅ Successfully synced release changes to develop branch"
