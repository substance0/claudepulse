version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - substance0
    commit-message:
      prefix: "chore(deps):"
      include: scope
    groups:
      semantic-release:
        dependency-type: production
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
      minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - substance0
    commit-message:
      prefix: "ci(actions):"
      include: scope
