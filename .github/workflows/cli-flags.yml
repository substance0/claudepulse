name: CLI flags

# Checks that the Claude CLI pinned in docker/claude-cli still lists every flag
# a pulse passes it, before a bump of that pin is merged. A pulse is lean only
# because of those flags, so a CLI that renamed or dropped one would make
# pulses costly or fail. The check reads the CLI's --help: it proves a flag
# exists, not that it behaves as before. To run it locally,
#   npm ci --omit=dev --prefix docker/claude-cli
#   node scripts/check-cli-flags.mjs docker/claude-cli/node_modules/.bin/claude
on:
  pull_request:
    paths:
      - "docker/claude-cli/**"
      - "src/features/claude/executor/**"
      - "scripts/check-cli-flags.mjs"
      - ".github/workflows/cli-flags.yml"
  push:
    branches:
      - main
    paths:
      - "docker/claude-cli/**"
      - "src/features/claude/executor/**"
      - "scripts/check-cli-flags.mjs"
      - ".github/workflows/cli-flags.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-flags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # The same install the image does, from the lockfile, so the version
      # checked is the version that ships.
      - name: Install the pinned CLI
        working-directory: docker/claude-cli
        run: npm ci --omit=dev --no-fund --no-audit

      - name: Show the CLI version
        run: docker/claude-cli/node_modules/.bin/claude --version

      - name: Check the pulse flags
        run: node scripts/check-cli-flags.mjs docker/claude-cli/node_modules/.bin/claude
