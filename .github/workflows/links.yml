name: Links

# Finds dead links in the documentation: when a change touches it, whether it
# arrives as a pull request or is pushed to main, and once a week for links
# that go dead on their own. Settings are in lychee.toml; to run it locally,
#   lychee --config lychee.toml '**/*.md'
on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The token lifts GitHub's rate limit for the many github.com links.
      # The lychee version is pinned; bump it here when a new one is released.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/repo" --workdir /repo
          lycheeverse/lychee:0.24.2 --config lychee.toml '**/*.md'
