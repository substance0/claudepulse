name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.released.outputs.tag }}
      version: ${{ steps.released.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release leaves HEAD on the release commit it tagged, or on
      # the unchanged commit when there was nothing to release. The image
      # build keys off this rather than off a release event: events created
      # with GITHUB_TOKEN start no other workflows.
      - name: Detect new release
        id: released
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-build.yml
    with:
      channel: release
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
