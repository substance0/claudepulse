services:
  claudepulse:
    # Pull pre-built image from GitHub Container Registry
    image: ghcr.io/substance0/claudepulse:latest
    container_name: claudepulse
    environment:
      # Timezone configuration (optional, for better log readability)
      # Set to your local timezone so log timestamps match your local time
      - TZ=${TZ:-UTC}

      # Core configuration
      - PROMPT_TEXT=${PROMPT_TEXT:-pulse check}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BACKOFF_MULTIPLIER=${RETRY_BACKOFF_MULTIPLIER:-2}
      - MAX_BACKOFF_MINUTES=${MAX_BACKOFF_MINUTES:-30}
      - SCHEDULED_START_HOUR=${SCHEDULED_START_HOUR}
      - DRY_RUN=${DRY_RUN:-false}

      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Resume the planned pulse after a restart (optional): uncomment this
      # line and the volume at the end of this file.
      # - STATE_DIR=/data
    # Secrets, one per line, next to this file (chmod 600):
    #   CLAUDE_CODE_OAUTH_TOKEN=...      required, from `claude setup-token`
    #   DISCORD_WEBHOOK_URL=...          optional, error alerts
    #   DISCORD_WINDOW_WEBHOOK_URL=...   optional, window reset announcements
    # Keep them out of `environment:` above: its values override this file.
    # The env file keeps secrets out of the compose file and shell history;
    # Docker still copies them into the container config (docker inspect).
    env_file:
      - claudepulse.env
    labels:
      - "com.claudepulse.service=claudepulse"
      - "com.claudepulse.description=ClaudePulse - Automated Claude Code session renewal with intelligent pulse scheduling for maximum Pro/Max subscription value"
    # Healthcheck comes from the image, which verifies the Claude CLI that
    # pulses run. Defining one here would override it.
    restart: unless-stopped
    # State file for STATE_DIR=/data (optional):
    # volumes:
    #   - claudepulse-data:/data

# volumes:
#   claudepulse-data:
