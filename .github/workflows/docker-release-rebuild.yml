name: Docker Release Rebuild

# Rebuild the image of a release that already exists, when its build failed:
#   gh workflow run docker-release-rebuild.yml -f tag=vX.Y.Z
# Tags: latest, X.Y.Z, X.Y, X, sha-<short>.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a release tag vX.Y.Z, got '$TAG'" >&2
            exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || {
            echo "Tag $TAG does not exist" >&2
            exit 1
          }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-build.yml
    with:
      channel: release
      ref: ${{ inputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
