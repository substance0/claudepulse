name: Docker Release

on:
  release:
    types: [published, created, prereleased]
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extract version from package.json for Docker image tagging and labels
      # This ensures the Docker image version always matches the application version
      - name: Extract version from package.json
        id: package-version
        run: |
          # Read version field from package.json
          VERSION=$(node -p "require('./package.json').version")

          # Fail if version is missing
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Version field is missing in package.json"
            exit 1
          fi

          # Export version for use in subsequent steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✓ Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate Docker image metadata (tags and OCI labels)
      # Uses version from package.json to ensure consistency
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with exact version from package.json (e.g., 1.0.1)
            type=raw,value=${{ steps.package-version.outputs.version }}
            # Tag with 'latest' for easy pulls
            type=raw,value=latest

      # Build multi-architecture Docker image with version labels
      # Version from package.json is passed as build arg and embedded in OCI labels
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.package-version.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
