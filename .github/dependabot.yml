version: 2
updates:
  # Every npm dependency is a development dependency (release tooling); the
  # application itself has none.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # With include: scope, subjects read "chore(deps-dev): ..."
      prefix: chore
      include: scope
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"

  # The Claude Code CLI installed in the image. Dependabot proposes npm's
  # latest release; the pin tracks the stable release, so review each bump.
  - package-ecosystem: npm
    directory: "/docker/claude-cli"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 2
    commit-message:
      # Subjects read "build(deps): ..."
      prefix: build
      include: scope

  # The image's Node base. It floats within its major, so this proposes new
  # majors only.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # Subjects read "ci(deps): ..."
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
