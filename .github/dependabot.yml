version: 2
updates:
  # Every npm dependency is a development dependency (release tooling); the
  # application itself has none.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # With include: scope, subjects read "chore(deps-dev): ..."
      prefix: chore
      include: scope
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # Subjects read "ci(deps): ..."
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
