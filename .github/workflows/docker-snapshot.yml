name: Docker Snapshot

# Build a testable image from any branch:
#   gh workflow run docker-snapshot.yml --ref <branch>
#   gh workflow run docker-snapshot.yml --ref <branch> -f platforms=linux/amd64,linux/arm64
# Tags: snapshot-<branch>. amd64 by default - the target is the NAS.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms, comma-separated"
        required: false
        type: string
        default: linux/amd64

permissions: {}

# One build per branch at a time, in order, so snapshot-<branch> always ends
# on the newest commit and no push is interrupted before it is attested.
concurrency:
  group: docker-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-build.yml
    with:
      channel: snapshot
      platforms: ${{ inputs.platforms }}
