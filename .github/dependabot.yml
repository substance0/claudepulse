version: 2
updates:
  # Every npm dependency is a development dependency (release tooling); the
  # application itself has none.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # With include: scope, subjects read "chore(deps-dev): ..."
      prefix: chore
      include: scope
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"

  # The Claude Code CLI installed in the image, pinned exactly and bumped to
  # npm's latest release.
  - package-ecosystem: npm
    directory: "/docker/claude-cli"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 2
    commit-message:
      # Subjects read "build(deps): ..."
      prefix: build
      include: scope

  # The image's Node base. It floats within its major, so this proposes new
  # majors only. Odd-numbered majors never become LTS and are skipped; an
  # even major is proposed on release, before its LTS date.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        versions: ["~> 25.0", "~> 27.0", "~> 29.0"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      # Subjects read "ci(deps): ..."
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
